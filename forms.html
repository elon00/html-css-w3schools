<form action="/submit" method="post">
  <label for="fname">First name:</label>
  <input type="text" id="fname" name="fname"><br><br>

  <label for="lname">Last name:</label>
  <input type="text" id="lname" name="lname"><br><br>

  <input type="submit" value="Submit">
</form>


<form>
  <input type="text" name="text"><br>
  <input type="password" name="pwd"><br>
  <input type="email" name="email"><br>
  <input type="number" name="num"><br>
  <input type="tel" name="phone"><br>
  <input type="url" name="url"><br>
  <input type="date" name="bday"><br>
  <input type="time" name="time"><br>
  <input type="checkbox" name="subscribe"><br>
  <input type="radio" name="gender" value="male"> Male<br>
  <input type="radio" name="gender" value="female"> Female<br>
  <input type="submit" value="Send">
</form>


<form>
  <label for="cars">Choose a car:</label>
  <select id="cars" name="cars">
    <option value="volvo">Volvo</option>
    <option value="audi">Audi</option>
    <option value="bmw">BMW</option>
  </select>
  <input type="submit">
</form>


<form>
  <label for="msg">Message:</label><br>
  <textarea id="msg" name="msg" rows="4" cols="50"></textarea><br>
  <input type="submit">
</form>


<form>
  <fieldset>
    <legend>Personal Info:</legend>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name"><br>
    <label for="age">Age:</label>
    <input type="number" id="age" name="age">
  </fieldset>
</form>


<form>
  <label for="browser">Choose your browser:</label>
  <input list="browsers" id="browser" name="browser">
  <datalist id="browsers">
    <option value="Chrome">
    <option value="Firefox">
    <option value="Edge">
    <option value="Safari">
  </datalist>
  <input type="submit">
</form>


<form>
  <input type="hidden" name="userid" value="1234">
  <input type="submit">
</form>


<form>
  <input type="text" name="username" required><br>
  <input type="email" name="email" required><br>
  <input type="submit">
</form>


<form>
  <input type="text" value="Disabled input" disabled><br>
  <input type="text" value="Readonly input" readonly><br>
  <input type="submit">
</form>


<form action="/submit-form" method="post">
  <input type="text" name="user">
  <input type="submit" value="Send">
</form>


<form>
  <button type="button" onclick="alert('Clicked')">Click Me</button>
  <button type="submit">Submit</button>
  <button type="reset">Reset</button>
</form>
