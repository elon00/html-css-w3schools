<canvas id="myCanvas" width="300" height="150" style="border:1px solid #000000;"></canvas>

<script>
  const c = document.getElementById("myCanvas");
  const ctx = c.getContext("2d");
  ctx.fillStyle = "red";
  ctx.fillRect(20, 20, 150, 100);
</script>


<canvas id="lineCanvas" width="300" height="150"></canvas>

<script>
  const c = document.getElementById("lineCanvas");
  const ctx = c.getContext("2d");
  ctx.moveTo(0, 0);
  ctx.lineTo(300, 150);
  ctx.stroke();
</script>


<canvas id="circleCanvas" width="200" height="200"></canvas>

<script>
  const c = document.getElementById("circleCanvas");
  const ctx = c.getContext("2d");
  ctx.beginPath();
  ctx.arc(100, 100, 50, 0, 2 * Math.PI);
  ctx.stroke();
</script>


<canvas id="textCanvas" width="400" height="150"></canvas>

<script>
  const c = document.getElementById("textCanvas");
  const ctx = c.getContext("2d");
  ctx.font = "30px Arial";
  ctx.fillText("Hello Canvas", 50, 70);
</script>


<canvas id="gradientCanvas" width="300" height="150"></canvas>

<script>
  const c = document.getElementById("gradientCanvas");
  const ctx = c.getContext("2d");
  const grd = ctx.createLinearGradient(0, 0, 300, 0);
  grd.addColorStop(0, "red");
  grd.addColorStop(1, "blue");
  ctx.fillStyle = grd;
  ctx.fillRect(10, 10, 280, 130);
</script>


<svg width="100" height="100">
  <circle cx="50" cy="50" r="40" stroke="black" stroke-width="3" fill="red" />
</svg>
